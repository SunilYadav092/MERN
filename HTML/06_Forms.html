<!--
  TOPIC: Forms
  -------------
  Forms collect user input and send it to a server.
  In the MEARN stack, this data usually gets POSTed
  to an Express API and stored in MongoDB.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forms Example</title>
</head>
<body>

  <h2>Registration Form</h2>

  <!--
    action = URL the form data is sent to
    method = HTTP method used (GET or POST)
  -->
  <form action="/submit" method="POST">

    <!-- Text input -->
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

    <!-- Email input (browser validates format) -->
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <!-- Password input (masks characters) -->
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" minlength="6" required><br><br>

    <!-- Radio buttons: pick ONE option -->
    <p>Gender:</p>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br><br>

    <!-- Checkboxes: pick MULTIPLE options -->
    <p>Skills:</p>
    <input type="checkbox" id="html" name="skills" value="HTML">
    <label for="html">HTML</label>
    <input type="checkbox" id="css" name="skills" value="CSS">
    <label for="css">CSS</label><br><br>

    <!-- Dropdown -->
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="india">India</option>
      <option value="usa">USA</option>
      <option value="other">Other</option>
    </select><br><br>

    <!-- Multi-line text -->
    <label for="bio">Short Bio:</label><br>
    <textarea id="bio" name="bio" rows="4" cols="40"></textarea><br><br>

    <!-- Submit button -->
    <button type="submit">Register</button>
  </form>

</body>
</html>
