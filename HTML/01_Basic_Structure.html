<!--
  TOPIC: Basic HTML Document Structure
  ------------------------------------
  Every HTML file follows the same skeleton:
    <!DOCTYPE html>  -> tells the browser this is HTML5
    <html>           -> root element, wraps everything
    <head>           -> metadata (not visible on the page)
    <body>           -> visible content of the page
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Structure Example</title>
</head>
<body>

  <!-- Everything inside <body> is what the user actually sees -->
  <h1>Welcome to My Page</h1>
  <p>This paragraph is inside the body, so it is visible.</p>

  <!--
    Try this: move the <h1> above into the <head> section
    and reload — it will disappear from the visible page,
    because <head> content is not rendered on screen.
  -->

</body>
</html>
